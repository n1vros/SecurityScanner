[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv", "vault", "files"]

[tool.ruff.lint]
# The legacy codebase predates the linter; gate on real breakage only
# (syntax errors, undefined names, bad comparisons) so CI stays meaningful.
select = ["E9", "F63", "F7", "F82"]
ignore = []
