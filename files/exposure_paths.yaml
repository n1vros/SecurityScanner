# exposure_paths.yaml
#
# High-signal exposure paths for bug bounty.
# Every path here has realistic bounty potential.
#
# Fields:
#   path        - URL path to probe
#   severity    - critical | high | medium
#   description - Finding description for Discord alert
#   signatures  - Strings that MUST appear in body to confirm (empty = 200 is enough)
#   tags        - Grouping for filtering
#   prio        - Scan priority (1=highest, 10=lowest). Lower = checked first per subdomain.
#                 Critical credential leaks: 1-2, Keys/certs: 2-3, DB dumps: 3-4,
#                 Backups/archives: 5-6, Debug panels: 6-7, Low-signal: 8-10

# ===========================================================================
# GIT REPOSITORY EXPOSURE
# critical — git-dumper can reconstruct entire source tree
# ===========================================================================

- path: /.git/HEAD
  severity: critical
  description: "Git HEAD exposed — full source code recoverable with git-dumper"
  signatures: ["ref: refs/"]
  tags: [git]
  prio: 1

- path: /.git/config
  severity: critical
  description: "Git config exposed — may contain remote URLs with embedded credentials"
  signatures: ["[core]"]
  tags: [git]
  prio: 2

- path: /.git/index
  severity: critical
  description: "Git index exposed — full list of all tracked files recoverable"
  signatures: []
  tags: [git]
  prio: 2

- path: /.git/packed-refs
  severity: high
  description: "Git packed-refs exposed — branch and tag names visible"
  signatures: ["refs/heads/"]
  tags: [git]
  prio: 3

- path: /.git/logs/HEAD
  severity: high
  description: "Git reflog exposed — commit history, author emails, branch names"
  signatures: ["HEAD@{"]
  tags: [git]
  prio: 3

